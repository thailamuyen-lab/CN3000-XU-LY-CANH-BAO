<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CN-3000 – Xử lý cờ báo</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f7f9;--card:#fff;--tx:#17212b;--mut:#6a7785;--bd:#dde3e9;--pri:#0f6e8c;--priS:#e6f3f7;
--okB:#e3f6e9;--okT:#145c2c;--acB:#fff3d6;--acT:#7a4b00;--bdB:#fde4e2;--bdT:#8a1c14}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--card:#19222b;--tx:#e8eef3;--mut:#9aa8b6;--bd:#2b3743;--pri:#4cb8d6;--priS:#16323c;
--okB:#14301f;--okT:#8fe0a9;--acB:#38290a;--acT:#f3cf80;--bdB:#3b1a18;--bdT:#f5aaa4}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:10px;min-height:40px;margin-bottom:12px}
.top h1{font-size:1rem;margin:0;color:var(--mut);font-weight:600;flex:1}
.back{border:0;background:var(--priS);color:var(--pri);border-radius:999px;padding:8px 14px;font:inherit;font-size:.9rem;cursor:pointer}
h2{font-size:1.5rem;margin:4px 0 16px;line-height:1.25}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile,.row{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;font:inherit;cursor:pointer;text-align:left}
.tile{padding:26px 12px;font-size:1.25rem;font-weight:700;text-align:center}
.row{display:block;width:100%;padding:16px;margin-bottom:10px;font-size:1.05rem;font-weight:600}
.tile:hover,.row:hover{border-color:var(--pri);background:var(--priS)}
.mean{color:var(--mut);font-size:.95rem;margin:-8px 0 18px}
.q{font-size:1.2rem;font-weight:600;margin:0 0 16px}
.opt{display:block;width:100%;padding:16px;margin-bottom:10px;border:2px solid var(--pri);background:var(--card);color:var(--tx);border-radius:14px;font:inherit;font-size:1.05rem;cursor:pointer;text-align:left}
.opt:hover{background:var(--priS)}
.res{border-radius:16px;padding:22px 18px;margin-bottom:16px}
.res.ok{background:var(--okB);color:var(--okT)}.res.act{background:var(--acB);color:var(--acT)}.res.bad{background:var(--bdB);color:var(--bdT)}
.res h2{margin:0 0 8px;font-size:1.5rem}
.res p{margin:0;font-size:1.1rem}
.ext{font-size:.85rem;font-style:italic;margin-top:10px!important}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer;margin-bottom:10px}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.foot{color:var(--mut);font-size:.82rem;margin-top:22px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* DÁN firebaseConfig CỦA BẠN VÀO ĐÂY (Firebase Console > Project settings > Your apps) */
window.FIREBASE_CONFIG={apiKey:"PASTE_API_KEY",authDomain:"PASTE.firebaseapp.com",projectId:"PASTE",appId:"PASTE"};
window.FB_ON=!/^PASTE/.test(window.FIREBASE_CONFIG.apiKey);
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,addDoc,query,where,limit,getDocs,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
if(window.FB_ON){
 const app=initializeApp(window.FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app);
 window.FB={
  login:()=>signInWithPopup(auth,new GoogleAuthProvider()),
  logout:()=>signOut(auth),
  save:d=>addDoc(collection(db,"logs"),{...d,uid:auth.currentUser.uid,email:auth.currentUser.email,at:serverTimestamp()}),
  history:async()=>(await getDocs(query(collection(db,"logs"),where("uid","==",auth.currentUser.uid),limit(100)))).docs.map(d=>{const x=d.data();return {...x,at:x.at&&x.at.toDate()}})
 };
 onAuthStateChanged(auth,u=>window.onAuth(u));
}
</script>
<script>
const R=(k,t,x)=>({k,t,x}),OK='ok',AC='act',BD='bad';
const ASK="Tài liệu không nêu trường hợp này. Đề xuất: hội ý người phụ trách, xem lại mẫu/thuốc thử trước khi trả.";
const sys=(t)=>({q:"Đã loại trừ lỗi hệ thống (Control/QC, thuốc thử, máy) chưa?",o:[["Đã loại trừ",R(OK,t)],["Chưa loại trừ",R(AC,"Chạy Control, kiểm tra thuốc thử và máy, rồi quay lại bước này.")]]});
const slight=(run)=>({n0:{q:run+" Kết quả sau khi chạy lại?",o:[["Ra kết quả, không còn cờ",R(OK,"Trả kết quả.")],["Ra kết quả nhưng vẫn báo cờ","n1"]]},
 n1:{q:"So sánh với kết quả lần 1. Hai kết quả có tương quan không?",o:[["Có tương quan",R(OK,"Trả kết quả. Có thể xem thêm Min1 Time của CWA để tự tin hơn.")],["Không tương quan",R(AC,ASK,1)]]}});
const calc={n0:{q:"Kiểm tra: đúng Lot hóa chất chưa, đã có đường calib chưa, đường calib đã validate chưa?",o:[
 ["Chưa calib cho Lot đang dùng",R(AC,"Thực hiện calib với Lot hóa chất mới, rồi validate đường calib. Sau đó: mẫu bệnh nhân có thể tính lại kết quả; kết quả QC không tính lại được, phải chạy lại.")],
 ["Đã calib nhưng chưa validate",R(AC,"Validate đường calib. Sau đó: mẫu bệnh nhân có thể tính lại kết quả; kết quả QC không tính lại được, phải chạy lại.")],
 ["Đã calib và validate đủ","n1"]]},
 n1:{q:"Loại mẫu bị báo lỗi?",o:[["Mẫu bệnh nhân",R(AC,"Có thể tính lại kết quả.")],["Mẫu QC",R(AC,"Kết quả QC không thể tính lại, phải chạy lại.")]]}};
const noCoagPT={n0:{q:"Ly tâm, chạy lại mẫu, tăng thời gian đo lên 360 giây. Kết quả?",o:[["Ra kết quả",R(OK,"Trả kết quả.")],["Vẫn báo No Coagulation","n1"]]},n1:sys("Trả kết quả >180 giây.")};
const DB=[
{t:["APTT"],f:"Early reaction (Early%)",m:"Máy nghi ngờ mẫu có hiện tượng đông sớm.",fl:{
 n0:{q:"Mở Evaluation data, đọc thời gian tại điểm 50%. Giá trị là?",o:[["< 20 giây",R(BD,"Lấy lại mẫu.")],["≥ 20 giây","n1"]]},
 n1:{q:"So sánh dữ liệu Min1 Time của CWA. Hai giá trị có gần nhau (không lệch quá 2 giây) không?",o:[["Gần nhau (≤ 2 giây)",R(OK,"Cân nhắc trả kết quả. Xem xét thêm: chẩn đoán, khâu lấy mẫu, nồng độ Fibrinogen.")],["Lệch > 2 giây",R(AC,ASK,1)]]}}},
{t:["APTT","PT"],f:"Analysis Time Over (ATO)",m:"Hết thời gian đo mặc định của máy nhưng chưa ghi nhận quá trình đông kết thúc. Thường gặp ở APTT.",fl:{
 n0:{q:"Nếu là mẫu mới, máy đã tự động chạy lại với thời gian đo 360 giây chưa?",o:[["Máy đã tự chạy lại","n1"],["Chưa chạy lại",R(AC,"Chạy lại mẫu với thời gian đo tăng lên 360 giây.")]]},
 n1:{q:"Kết quả lần chạy lại?",o:[["Ra kết quả",R(OK,"Trả kết quả của lần chạy sau.")],["Vẫn báo ATO",R(OK,"Cân nhắc trả kết quả >180 giây.")]]}}},
{t:["APTT","PT"],f:"Slight Coagulation",m:"Ghi nhận phản ứng đông máu yếu (nhiều trường hợp do nồng độ Fibrinogen thấp). Thường gặp ở PT.",fl:slight("Ly tâm, chạy lại mẫu, tăng thời gian đo lên 360 giây.")},
{t:["PT"],f:"Flat Curve",m:"Thời gian phản ứng chậm, có thể do Fibrinogen thấp, thiếu hụt yếu tố, nhiễm chống đông. Gặp ở PT.",fl:{
 n0:{q:"Ly tâm, chạy lại mẫu, tăng thời gian đo lên 360 giây. Kết quả?",o:[["Ra kết quả, không còn cờ",R(OK,"Trả kết quả.")],["Ra kết quả nhưng vẫn báo cờ","n1"],["Không ra kết quả, vẫn Flat Curve","n2"]]},
 n1:{q:"So sánh với kết quả lần 1. Có tương quan không?",o:[["Có tương quan",R(OK,"Trả kết quả. Có thể xem thêm Min1 Time của CWA để tự tin hơn.")],["Không tương quan",R(AC,ASK,1)]]},
 n2:sys("Trả kết quả >180 giây.")}},
{t:["APTT","PT"],f:"No Coagulation",m:"Không ghi nhận quá trình phản ứng đông máu diễn ra trong cuvette.",fl:noCoagPT},
{t:["Fibrinogen"],f:"Coagulation Curve error",m:"Đường cong phản ứng bị bất thường.",fl:{
 n0:{q:"Kiểm tra chất lượng OVB: thời gian onboard, còn lạnh không?",o:[["OVB có vấn đề (quá hạn onboard / còn lạnh)",R(AC,"Cân nhắc thay OVB mới, để về nhiệt độ phòng rồi chạy lại. Nên thay OVB hằng ngày để đảm bảo kết quả Fibrinogen.")],["OVB ổn","n1"]]},
 n1:{q:"Nghi do chất lượng mẫu: ly tâm, chạy lại mẫu. Kết quả?",o:[["Ra kết quả",R(OK,"Trả kết quả.")],["Vẫn không ra kết quả",R(BD,"Lấy lại mẫu khác.")]]}}},
{t:["Fibrinogen","D-Dimer"],f:"Calculation Failure",m:"Không có đường calib phù hợp khi phân tích mẫu.",fl:calc},
{t:["Fibrinogen"],f:"Slight Coagulation",m:"Ghi nhận phản ứng đông máu yếu.",fl:slight("Ly tâm, chạy lại mẫu, đổi tỉ lệ pha loãng mẫu sang 4/1.")},
{t:["Fibrinogen"],f:"No Coagulation",m:"Không ghi nhận quá trình phản ứng đông máu diễn ra trong cuvette.",fl:{
 n0:{q:"Ly tâm, chạy lại mẫu, đổi tỉ lệ pha mẫu sang 4/1. Kết quả?",o:[["Ra kết quả",R(OK,"Trả kết quả.")],["Không ra kết quả","n1"]]},n1:sys("Trả kết quả <0.3 g/dL.")}},
{t:["D-Dimer"],f:"No linearity / No polynomial adjustment / Range is non-linear",m:"Đường cong phản ứng bất thường.",fl:{
 n0:{q:"Kiểm tra lại mẫu, hóa chất; QC lại nếu cần. Sau đó ly tâm, chạy lại mẫu. Kết quả?",o:[["Ra kết quả",R(OK,"Trả kết quả.")],["Vẫn báo lỗi",R(BD,"Lấy mẫu mới và phân tích lại.")]]}}},
{t:["D-Dimer"],f:"Antigen excess",m:"Nồng độ D-Dimer quá cao.",fl:{
 n0:{q:"Chạy lại với tỉ lệ pha loãng cao hơn (1/10). Kết quả?",o:[["Ra kết quả",R(OK,"Trả kết quả. Lưu ý: ngưỡng đo kit Innovance D-Dimer là 0.19–35.2 mg/L (190–35200 ng/mL).")],["Vẫn lỗi / vượt ngưỡng",R(AC,ASK,1)]]}}}
];

const $a=document.getElementById("app");
const TESTS=["APTT","PT","Fibrinogen","D-Dimer"];
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let S={sc:"test",test:null,sel:null,node:"n0",trail:[]},H=[];
let U=null,AUTH=!window.FB_ON,HIST=null;
window.onAuth=u=>{U=u;AUTH=true;H=[];S={sc:"test",test:null,sel:null,node:"n0",trail:[]};draw()};
const loginHtml=()=>`<h2 style="margin-top:40px">CN-3000 · Xử lý cờ báo</h2><p class="mean" style="margin:0 0 24px">Đăng nhập bằng tài khoản Gmail để sử dụng.</p><button class="btn p" data-a="login">Đăng nhập với Google</button><p class="foot" id="cm"></p>`;
const KD={ok:"Trả kết quả",act:"Làm thêm",bad:"Lấy lại mẫu"};
function histHtml(){let h="<h2>Lịch sử xử lý</h2>";if(!HIST)return h+'<p class="foot">Đang tải…</p>';if(!HIST.length)return h+'<p class="foot">Chưa có lịch sử.</p>';
 return h+HIST.map(x=>`<div class="row" style="cursor:default"><b>${esc(x.test)} › ${esc(x.flag)}</b><br><small>${x.at?x.at.toLocaleString("vi-VN"):""} · ${KD[x.kind]||""}</small></div>`).join("")}
const go=(n)=>{H.push(JSON.stringify(S));S=Object.assign({},S,n);draw()};
function noteText(){const r=S.res;return `[CN-3000] ${S.test} – ${S.sel.f}: `+S.trail.map(s=>s.a).join("; ")+` => ${r.t}`}
function draw(){
 if(!AUTH){$a.innerHTML='<p class="foot">Đang kết nối…</p>';return}
 if(window.FB_ON&&!U){$a.innerHTML=loginHtml();return}
 let h=`<div class="top">${H.length?'<button class="back" data-a="back">← Quay lại</button>':""}<h1>${S.test?esc(S.test)+(S.sel?" › "+esc(S.sel.f):""):"CN-3000 · Xử lý cờ báo"}</h1></div>`;
 if(S.sc==="hist"){h+=histHtml()}else if(S.sc==="test"){
  h+=`<h2>Xét nghiệm nào bị cờ báo?</h2><div class="grid">`+TESTS.map(t=>`<button class="tile" data-a="test" data-v="${t}">${t}</button>`).join("")+`</div>${U?`<div class="grid" style="margin-top:12px"><button class="btn" data-a="hist">Lịch sử</button><button class="btn" data-a="logout">Đăng xuất</button></div><p class="foot">${esc(U.email)}</p>`:""}
  <p class="foot">Lưu ý: để loại trừ vấn đề ở thuốc thử, có thể chạy Control. Dùng đúng rack QC khi chạy Control đầu ngày.</p>`;
 }else if(S.sc==="flag"){
  h+=`<h2>Máy báo cờ nào?</h2>`+DB.map((e,i)=>e.t.includes(S.test)?`<button class="row" data-a="flag" data-v="${i}">${esc(e.f)}</button>`:"").join("");
 }else if(S.sc==="step"){
  const n=S.sel.fl[S.node];
  h+=`<p class="mean">${esc(S.sel.m)}</p><p class="q">${esc(n.q)}</p>`+n.o.map((o,i)=>`<button class="opt" data-a="opt" data-v="${i}">${esc(o[0])}</button>`).join("");
 }else{
  const r=S.res,T={ok:"✓ Có thể trả kết quả",act:"➜ Cần làm thêm",bad:"✗ Lấy lại mẫu"}[r.k];
  h+=`<div class="res ${r.k}"><h2>${T}</h2><p>${esc(r.t)}</p>${r.x?'<p class="ext">Gợi ý ngoài tài liệu gốc, cần người phụ trách xác nhận.</p>':""}</div>
  <button class="btn p" data-a="copy">Sao chép ghi chú</button><button class="btn" data-a="home">Xử lý cờ khác</button><p class="foot" id="cm">Công cụ hỗ trợ theo bảng hướng dẫn nội bộ; quyết định trả kết quả thuộc người duyệt kết quả.</p>`;
 }
 $a.innerHTML=h;window.scrollTo(0,0);
}
$a.addEventListener("click",ev=>{
 const b=ev.target.closest("button");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==="back"){S=JSON.parse(H.pop());draw()}
 else if(a==="login"){FB.login().catch(e=>{document.getElementById("cm").textContent="Đăng nhập không thành công: "+(e.code||e.message)})}
 else if(a==="logout"){FB.logout()}
 else if(a==="hist"){HIST=null;go({sc:"hist"});FB.history().then(r=>{HIST=r.sort((x,y)=>(y.at||0)-(x.at||0)).slice(0,30);if(S.sc==="hist")draw()}).catch(()=>{HIST=[];if(S.sc==="hist")draw()})}
 else if(a==="test")go({sc:"flag",test:v})
 else if(a==="flag")go({sc:"step",sel:DB[+v],node:"n0",trail:[]})
 else if(a==="opt"){const n=S.sel.fl[S.node],o=n.o[+v],tr=S.trail.concat([{a:o[0]}]);
  if(typeof o[1]==="string")go({node:o[1],trail:tr});else{go({sc:"res",res:o[1],trail:tr});if(U)FB.save({test:S.test,flag:S.sel.f,steps:tr.map(s=>s.a),kind:o[1].k,result:o[1].t}).catch(()=>{})}}
 else if(a==="home"){H=[];S={sc:"test",test:null,sel:null,node:"n0",trail:[]};draw()}
 else if(a==="copy"){const t=noteText(),done=()=>{document.getElementById("cm").textContent="Đã sao chép ghi chú."};
  try{navigator.clipboard.writeText(t).then(done,()=>{throw 0})}catch(e){const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy");done()}catch(_){document.getElementById("cm").textContent=t}x.remove()}}
});
draw();
</script>
</body>
</html>
